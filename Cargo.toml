[package]
name = "sylvan-sys"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Samuel Pastva <sam.pastva@gmail.com>"]
build = "build.rs"
# Prevents linking two versions of Sylvan into the same binary.
links = "sylvan"
# Only package the parts of the submodules that are needed to build the crate.
include = [
    "/build.rs",
    "/src",
    "/wrapper",
    "/README.md",
    "/LICENSE",
    "/3rd-party/lace/LICENSE",
    "/3rd-party/lace/src",
    "/3rd-party/sylvan/LICENSE",
    "/3rd-party/sylvan/CMakeLists.txt",
    "/3rd-party/sylvan/src",
]
description = "Bindings for the Sylvan parallel decision diagrams library."
homepage = "https://github.com/daemontus/sylvan-sys"
repository = "https://github.com/daemontus/sylvan-sys"
readme = "README.md"
keywords = ["bdd", "symbolic", "parallel"]
categories = ["data-structures", "mathematics", "science"]
license = "Apache-2.0"

[build-dependencies]
cc = { version = "1.9", features = ["parallel"] }
cargo-emit = "0.2"
bindgen = { version = "0.72", features = ["experimental"] }
